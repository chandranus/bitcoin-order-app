
name: Bitcoin Order App CI Pipeline

# Trigger GitHub Actions automatically and manually
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Repository permissions
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure Java 17
      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Verify Java and Maven installation
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # Step 4: Compile Java application
      - name: Compile Application
        run: mvn -B clean compile

      # Step 5: Execute unit tests
      - name: Run Unit Tests
        run: mvn -B test

      # Step 6: Package application into JAR
      - name: Package Application
        run: mvn -B -DskipTests package

      # Step 7: Upload unit test results
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-order-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      # Step 8: Upload packaged application
      - name: Upload Application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-order-app-jar
          path: target/*.jar
          if-no-files-found: warn
          retention-days: 7

      # Step 9: Display completion message
      - name: Build Summary
        if: success()
        run: |
          echo "Bitcoin Order App CI Pipeline completed."
          echo "Compilation: SUCCESS"
          echo "Unit Tests: SUCCESS"
          echo "Packaging: SUCCESS"
